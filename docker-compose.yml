services:
  db:
    image: postgres:16-alpine
    container_name: vsnap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vsnapchecklist
    ports:
      - "5432:5432"
    volumes:
      - vsnap_db_data:/var/lib/postgresql/data

volumes:
  vsnap_db_data:
